# A tag v<version> builds the image for amd64 and arm64, pushes it to ghcr.io and publishes a
# release with mikan-addon.json: the entry mikan reads from github.com/<owner>/<repo>
# (Аддоны → Источники). The entry pins the image by its digest. With the secret
# MIKAN_ADDON_KEY (an ed25519 private key, base64 of its 32-byte seed) it is signed as well:
# mikan-addon.json.sig, and the panel then holds the source to that key.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test -race ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Names
        id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r .id addon.json)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            ADDON_ID=${{ steps.names.outputs.id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
      - name: The entry
        run: |
          jq --arg v "${{ steps.names.outputs.version }}" --arg img "${{ steps.names.outputs.image }}" \
             --arg dig "${{ steps.build.outputs.digest }}" --arg home "https://github.com/${GITHUB_REPOSITORY}" \
             '. + {version: $v, image: $img, digest: $dig, homepage: $home}' addon.json > mikan-addon.json
          cat mikan-addon.json
      - name: Sign
        env:
          KEY: ${{ secrets.MIKAN_ADDON_KEY }}
        if: env.KEY != ''
        run: go run ./tools/sign -key-env KEY mikan-addon.json > mikan-addon.json.sig
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=mikan-addon.json
          [ -f mikan-addon.json.sig ] && files="$files mikan-addon.json.sig"
          gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" --notes "Образ: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"
